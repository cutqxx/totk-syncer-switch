name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl headers
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Host tests (ZIP, meta, PROPFIND, config, WebDAV vs mock server)
        run: make -C switch/tests

  switch-nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Portlibs
        run: dkp-pacman -Syu --noconfirm --needed switch-dev switch-curl switch-mbedtls switch-zlib
      - name: Build .nro
        run: make -C switch -j4
      - uses: actions/upload-artifact@v4
        with:
          name: totk-sync-nro
          path: switch/totk-sync.nro
